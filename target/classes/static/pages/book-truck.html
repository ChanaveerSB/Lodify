<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Truck | LOADIFY</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <main class="dashboard">
    <aside class="sidebar">
      <a class="brand" href="/pages/dashboard.html"><span class="logo">🚛</span><span>LOADIFY</span></a>
      <!-- <nav><a href="/pages/dashboard.html">Dashboard</a><a href="/pages/post-trip.html">Post Truck</a><a href="/pages/my-bookings.html">My Bookings</a><a href="#" onclick="Loadify.logout()">Logout</a></nav> -->
      <nav>
        <a href="/pages/dashboard.html"><span>🏠</span> Dashboard</a>
        <a href="/pages/my-bookings.html"><span>📅</span> My Bookings</a>
        <a href="#" onclick="Loadify.logout()"><span>🚪</span> Logout</a>
      </nav>
    </aside>

    <section class="main">
      <div class="toolbar">
        <h1>Search Return Trucks</h1><span class="badge">Pagination and sorting via API</span>
      </div>
      <form class="searchbar card" id="bookSearch">
        <input name="source" placeholder="Source">
        <input name="destination" placeholder="Destination">
        <input name="date" type="date">
        <input name="capacity" type="number" placeholder="Required Capacity">
        <button class="btn btn-primary">Search</button>
      </form>
      <section class="section" style="padding-left:0;padding-right:0">
        <div class="cards" id="truckResults"></div>
      </section>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    if (!Loadify.currentUser()) location.href = "/pages/login.html";
    Loadify.bindSearch("#bookSearch", "#truckResults");
    Loadify.loadTrucks("#truckResults");
  </script>
</body>

</html>
