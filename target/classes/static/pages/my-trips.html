<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips | LOADIFY</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <main class="dashboard">
        <aside class="sidebar"><a class="brand" href="/pages/dashboard.html"><span
                    class="logo">🚛</span><span>LOADIFY</span></a>
            <nav><a href="/pages/dashboard.html">Dashboard</a><a href="/pages/post-trip.html">Post Truck</a><a href="#"
                    onclick="Loadify.logout()">Logout</a></nav>
        </aside>
        <section class="main">
            <div class="toolbar">
                <h1>My Trips</h1><span class="badge">Table view</span>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>Route</th>
                        <th>Date</th>
                        <th>Capacity (Tons: Available/Total)</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>
    </main>
    <script src="/js/app.js"></script>
    <script>const u = Loadify.currentUser(); if (!u) location.href = '/pages/login.html'; Loadify.api(`/trucks/provider/${u.userId}`).then(list => rows.innerHTML = list.map(t => `<tr><td>${t.source} -> ${t.destination}</td><td>${t.departureDate}</td><td>${t.availableCapacity}/${t.capacity}</td><td><span class="badge">${t.status}</span></td></tr>`).join('')).catch(() => rows.innerHTML = '<tr><td colspan="4">No posted trips yet.</td></tr>');</script>
</body>

</html>
