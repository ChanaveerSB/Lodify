<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | LOADIFY</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="dashboard">
    <aside class="sidebar"><a class="brand" href="/pages/dashboard.html"><span class="logo">🚛</span><span>LOADIFY</span></a><nav><a href="/pages/book-truck.html">Book Truck</a><a href="/pages/my-bookings.html">My Bookings</a><a href="#" onclick="Loadify.logout()">Logout</a></nav></aside>
    <section class="main">
      <h1>Confirm Booking</h1>
      <div class="card" id="pricePreview">Estimated pricing will appear after weight entry.</div>
      <form class="form card" id="bookingForm">
        <input name="customerName" placeholder="Customer Name" required>
        <input name="customerPhone" pattern="[0-9]{10}" placeholder="Contact Number" required>
        <input name="goodsType" placeholder="Goods Type" required>
        <input name="weight" id="weight" type="number" step="0.1" placeholder="Goods Weight" required>
        <input name="pickupLocation" placeholder="Pickup Location" required>
        <input name="dropLocation" placeholder="Drop Location" required>
        <input name="bookingDate" type="date" required>
        <input name="requiredTrucks" type="number" min="1" placeholder="Number Of Trucks Required" required>
        <textarea name="bookingNotes" placeholder="Additional Notes"></textarea>
        <div class="actions"><button class="btn btn-primary">Book Now</button><a class="btn btn-dark" href="/pages/book-truck.html">Cancel</a></div>
      </form>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const user = Loadify.currentUser();
    if (!user) location.href = "/pages/login.html";
    const truckId = Number(localStorage.getItem("pendingTruckId") || 1);
    let selectedTruck = null;
    Loadify.api(`/trucks/${truckId}`).then(t => { selectedTruck = t; pricePreview.textContent = `Selected: ${t.source} to ${t.destination}, Available ${t.availableCapacity} tons, Rs. ${t.pricePerTon}/ton`; }).catch(() => {});
    weight.addEventListener("input", () => {
      if (selectedTruck) pricePreview.textContent = `Estimated total: Rs. ${(Number(weight.value || 0) * selectedTruck.pricePerTon).toFixed(2)}`;
    });
    bookingForm.addEventListener("submit", async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(bookingForm));
      data.truckId = truckId;
      data.customerId = user.userId;
      data.weight = Number(data.weight);
      data.requiredTrucks = Number(data.requiredTrucks);
      try {
        await Loadify.api("/bookings", { method: "POST", body: JSON.stringify(data) });
        Loadify.toast("Booking confirmed. Capacity updated.");
        setTimeout(() => location.href = "/pages/my-bookings.html", 900);
      } catch (err) { Loadify.toast(err.message); }
    });
  </script>
</body>
</html>
