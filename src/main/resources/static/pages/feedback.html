<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback | LOADIFY</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="dashboard">
        <aside class="sidebar">
            <a class="brand" href="/pages/dashboard.html"><span class="logo">🚛</span><span>LOADIFY</span></a>
            <nav id="navMenu"></nav> </aside>

        <section class="main">
            <div class="feedback-container">
                <h1>Submit Feedback / Complaint</h1>
                <p>Having an issue with a trip? Let us know below.</p>
                
                <form class="form card" id="feedbackForm">
                    <div class="form-group">
                        <label>Issue Category</label>
                        <select name="category" required>
                            <option value="Booking Issue">Booking Issue</option>
                            <option value="Driver Conduct">Driver Conduct</option>
                            <option value="Payment Issue">Payment Issue</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Detailed Description</label>
                        <textarea name="message" rows="5" placeholder="Please describe your issue in detail..." required></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Submit Feedback</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script>
    const form = document.getElementById('feedbackForm');

    console.log("FORM:", form);

    form.addEventListener('submit', async (e) => {

        console.log("SUBMIT EVENT TRIGGERED");

        e.preventDefault();

        const formData = Object.fromEntries(new FormData(form));

        console.log(formData);

        await Loadify.submitFeedback(formData);

        console.log("AFTER API");

        Loadify.toast("Feedback received. Our team will review it.");

        form.reset();
    });
</script>

</body>
</html>
