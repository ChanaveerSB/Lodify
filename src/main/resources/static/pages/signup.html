<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup | LOADIFY</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-art">
      <a class="brand" href="/index.html"><span class="logo">🚛</span><span>LOADIFY</span></a>
      <h1>Optimize Every Return Trip</h1>
      <p>Create your account to post return trucks or book available capacity.</p>
    </section>
<section class="auth-card">
  <h2>Create Account</h2>
  <form class="form" id="signupForm">
    <div class="form-group">
      <label>Full Name</label>
      <input name="fullName" placeholder="Your Full Name" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input name="email" type="email" placeholder="email@example.com" required>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input name="phone" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
    </div>
    <div class="form-group">
      <label>Security</label>
      <input name="password" type="password" minlength="6" placeholder="Password" required>
      <input name="confirmPassword" type="password" minlength="6" placeholder="Confirm Password" required style="margin-top: 10px;">
    </div>
    <div class="form-group">
      <label>Account Type</label>
      <select name="role" required>
        <option value="">-- Choose Role --</option>
        <option value="TRANSPORT_PROVIDER">Transport Provider</option>
        <option value="CUSTOMER">Customer</option>
        <!-- <option value="ADMIN">System Administrator</option> -->
      </select>
    </div>
    <button class="btn btn-primary">Create Account</button>
  </form>
  <p>Already registered? <a href="/pages/login.html"><b>Login</b></a></p>
</section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    signupForm.addEventListener("submit", async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(signupForm));
      try {
        await Loadify.api("/auth/signup", { method: "POST", body: JSON.stringify(data) });
        Loadify.toast("Signup successful. Please login.");
        setTimeout(() => location.href = "/pages/login.html", 800);
      } catch (err) { Loadify.toast(err.message); }
    });
  </script>
</body>
</html>
